# Stage 2 of 2 — final TLS + redirect. Requires:
#   certbot certonly --nginx -d library.alveronfashion.com
# and /etc/nginx/conf.d/alveron-library-limits.conf (limits.conf).
server {
    listen 80;
    listen [::]:80;
    server_name library.alveronfashion.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name library.alveronfashion.com;

    ssl_certificate     /etc/letsencrypt/live/library.alveronfashion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/library.alveronfashion.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 80m;
    server_tokens off;

    # ChatGPT / read-only retrieval surface. Bearer-token protected by the app;
    # nginx only rate-limits it.
    location /api/library/ {
        limit_req zone=alveron_library burst=40 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location = /api/auth/login {
        limit_req zone=alveron_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Owner UI and session-authenticated management. The app enforces login.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Defence in depth: nothing below is ever served by the app, but never proxy it.
    location ~ ^/(bin|data|deploy|mcp)/ { return 404; }
}
