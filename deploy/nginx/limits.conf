# /etc/nginx/conf.d/alveron-library-limits.conf
# 20 requests/second per client IP on the read-only library surface, with a
# small burst so a normal styling request is never throttled.
limit_req_zone $binary_remote_addr zone=alveron_library:10m rate=20r/s;

# Owner login: slow enough to make online guessing impractical.
limit_req_zone $binary_remote_addr zone=alveron_login:10m rate=5r/m;
