# Stage 1 of 2 — HTTP only, so certbot can validate the domain.
# Install as /etc/nginx/sites-available/alveron-library, symlink into
# sites-enabled, `nginx -t && systemctl reload nginx`, then issue the cert:
#   certbot certonly --nginx -d library.alveronfashion.com
# Then replace this file with alveron-library.conf and reload.
server {
    listen 80;
    listen [::]:80;
    server_name library.alveronfashion.com;

    client_max_body_size 80m;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~ ^/(bin|data|deploy|mcp)/ { return 404; }
}
