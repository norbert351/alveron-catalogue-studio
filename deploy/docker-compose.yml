# Alveron Product Library — private infrastructure.
#
# MinIO is NOT in this file: MinIO Community Edition no longer publishes Docker
# images or prebuilt binaries. We run the last official CE binary from the
# pinned GitHub release under PM2 (see run-minio.sh), bound to 127.0.0.1:9000.
#
# This file only runs PostgreSQL, bound to host loopback so the app can reach it
# without exposing the database to the Internet.
name: alveron-library

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: alveron-library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
